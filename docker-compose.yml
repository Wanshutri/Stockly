services:
  db:
    image: postgres:15
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db-init:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    networks:
      - app-network

  adminapp:
    build: ./admin-app
    restart: always
    env_file:
      - .env
    depends_on:
      - db
      - webapp
    environment:
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    ports:
      - "81:81"
    networks:
      - app-network

  webapp:
    build: ./web-app
    restart: always
    env_file:
      - .env
    depends_on:
      - db
    environment:
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    ports:
      - "80:80"
    networks:
      - app-network

volumes:
  db-data:


networks:
  app-network:
